<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareDose | Medication made simple</title>
    <link rel="stylesheet" href="/CareDose/src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "react-router-dom": "https://esm.sh/react-router-dom@6.28.2",
          "lucide-react": "https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const response = await fetch('/CareDose/src/main.jsx');
      let source = await response.text();
      source = source.replace("import './styles.css';", '');
      source = source.replace('basename={import.meta.env.BASE_URL}', 'basename="/CareDose/"');
      const transformed = Babel.transform(source, { presets: ['react'] }).code;
      const blob = new Blob([transformed], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      await import(url);
      URL.revokeObjectURL(url);
    </script>
  </body>
</html>
